name: Normalize mobile playback source

on:
  push:
    branches:
      - fix/restore-mobile-autoplay-20260730
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-mobile-autoplay-20260730
          fetch-depth: 0

      - name: Normalize player controller block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('site/js/player-controller.js')
          text = path.read_text(encoding='utf-8')
          old = '''setPlayerUiState("loading", playback.vodId, loadingStartSec, playback.statusLabel, loadingMode);

// Keep mobile playback inside the tap event. The asynchronous Twitch SDK mount
// can finish after the user gesture and browsers then reject unmuted play().
if (isMobileIframePlayback()) {
  if (state.playerMode === "interactive") {
    destroyInteractivePlayer();
  }
  clearInteractiveMountState();
  mountIframePlayer(playback);
  return;
}

if (isSeekReadySameVod) {'''
          new = '''  setPlayerUiState("loading", playback.vodId, loadingStartSec, playback.statusLabel, loadingMode);

  // Keep mobile playback inside the tap event. The asynchronous Twitch SDK mount
  // can finish after the user gesture and browsers then reject unmuted play().
  if (isMobileIframePlayback()) {
    if (state.playerMode === "interactive") {
      destroyInteractivePlayer();
    }
    clearInteractiveMountState();
    mountIframePlayer(playback);
    return;
  }

  if (isSeekReadySameVod) {'''
          if text.count(old) != 1:
              raise SystemExit(f'formatting block count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/js/player-controller.js
          git commit -m "Normalize mobile playback implementation"
          git push origin HEAD:fix/restore-mobile-autoplay-20260730
