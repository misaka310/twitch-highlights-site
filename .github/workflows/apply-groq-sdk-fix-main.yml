name: Apply Groq SDK fix branch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-groq-sdk-fix-main.yml"
      - ".github/scripts/apply_groq_sdk_fix.py"

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: fix/groq-official-sdk-qwen-20260729
          path: target
          fetch-depth: 0

      - name: Check out main automation files
        uses: actions/checkout@v4
        with:
          ref: main
          path: automation

      - name: Apply transport fix
        working-directory: target
        run: python ../automation/.github/scripts/apply_groq_sdk_fix.py

      - name: Install Groq SDK
        working-directory: target
        run: python -m pip install --quiet groq

      - name: Run Python tests
        working-directory: target
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Commit target branch
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/headline_generation.py requirements-transcribe.txt tests/test_groq_sdk_transport.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Use official Groq SDK for Qwen headlines"
          git push origin HEAD:fix/groq-official-sdk-qwen-20260729
