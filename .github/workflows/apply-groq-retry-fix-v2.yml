name: Apply Groq retry fix v2

on:
  push:
    branches:
      - fix/groq-rate-limit-retry-20260728

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fix
        run: python tools/apply_groq_retry_fix.py

      - name: Run tests
        run: |
          python -m compileall scripts/headline_generation.py tests/test_groq_retry_delay.py
          python -m unittest tests.test_groq_retry_delay tests.test_headline_fallback -v

      - name: Commit fix
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-groq-retry-fix.yml
          rm -f .github/workflows/apply-groq-retry-fix-v2.yml
          rm -f tools/apply_groq_retry_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Honor Groq rate-limit retry delays"
          git push
