name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript unit tests
        run: node --test tests/*.test.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser tests
        run: >-
          npx playwright test
          tests/ui.spec.js
          tests/playback-policy.spec.js
          tests/player-portal.spec.js
          tests/rewind.spec.js
          tests/latest-vods-public.spec.js
          tests/mobile-playback-recovery.spec.js
          tests/mobile-player-size.spec.js
          --project=desktop
          --project=mobile

  production-mobile-playback:
    if: >-
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[live-mobile]')) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.title, '[live-mobile-smoke]'))
    needs: frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_BASE_URL: https://dotitao-moments.onrender.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify real production mobile playback
        run: npx playwright test --config=playwright.live.config.js

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-mobile-playback-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
