name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript unit tests
        run: node --test tests/*.test.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser tests
        run: >-
          npx playwright test
          tests/ui.spec.js
          tests/playback-policy.spec.js
          tests/player-portal.spec.js
          tests/rewind.spec.js
          tests/latest-vods-public.spec.js
          tests/mobile-playback-recovery.spec.js
          tests/mobile-iframe-autoplay.spec.js
          --project=desktop
          --project=mobile
