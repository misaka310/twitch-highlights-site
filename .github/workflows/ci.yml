name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  apply-real-mobile-playback-fix:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'fix/verify-real-mobile-playback-20260730' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/verify-real-mobile-playback-20260730
          fetch-depth: 0

      - name: Apply Twitch minimum-size fix
        run: python scripts/apply_mobile_player_size_fix.py

      - name: Commit Twitch minimum-size fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/styles.css tests/mobile-player-size.spec.js
          git commit -m "Meet Twitch mobile embed dimensions"
          git push origin HEAD:fix/verify-real-mobile-playback-20260730

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript unit tests
        run: node --test tests/*.test.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop browser tests
        run: >-
          npx playwright test
          tests/ui.spec.js
          tests/playback-policy.spec.js
          tests/player-portal.spec.js
          tests/rewind.spec.js
          tests/latest-vods-public.spec.js
          tests/mobile-playback-recovery.spec.js
          --project=desktop

      - name: Run mobile browser tests
        run: >-
          npx playwright test
          tests/ui.spec.js
          tests/playback-policy.spec.js
          tests/player-portal.spec.js
          tests/latest-vods-public.spec.js
          tests/mobile-playback-recovery.spec.js
          tests/rewind.spec.js
          tests/mobile-player-size.spec.js
          --project=mobile
