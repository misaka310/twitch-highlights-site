name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install repository dependencies
        run: npm run setup

      - name: Install root Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install frontend Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run canonical verification
        run: npm run verify

      - name: Upload verification failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-failure
          path: |
            test-results/
            playwright-report/
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore

  production-mobile-playback:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      LIVE_BASE_URL: https://dotitao-moments.onrender.com

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install repository dependencies
        run: npm run setup

      - name: Install root Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production publish directory
        run: npm run build:public

      - name: Verify real Twitch and deployed production
        run: npm run verify:live

      - name: Record successful production verification
        shell: bash
        run: |
          set -euo pipefail
          verification_branch="automation/production-verification"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          blob_sha="$(git hash-object -w production-verification.json)"
          tree_sha="$(printf '100644 blob %s\tproduction-verification.json\n' "$blob_sha" | git mktree)"
          parent_sha="$(git ls-remote origin "refs/heads/$verification_branch" | awk '{print $1}')"

          if [[ -n "$parent_sha" ]]; then
            git fetch --no-tags --depth=1 origin "refs/heads/$verification_branch"
            marker_commit="$(printf 'Record successful production verification for %s\n' "$GITHUB_SHA" | git commit-tree "$tree_sha" -p "$parent_sha")"
          else
            marker_commit="$(printf 'Record successful production verification for %s\n' "$GITHUB_SHA" | git commit-tree "$tree_sha")"
          fi

          git push --force origin "$marker_commit:refs/heads/$verification_branch"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-mobile-playback-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
