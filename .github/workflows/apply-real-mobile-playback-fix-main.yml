name: Apply real mobile playback fix from main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/verify-real-mobile-playback-20260730
          fetch-depth: 0

      - name: Apply player and test fixes
        shell: bash
        run: |
          set -euo pipefail
          git show 92b48fa6552b4bff67c2222238974de4abd14053:site/js/player-controller.js > site/js/player-controller.js
          git show 92b48fa6552b4bff67c2222238974de4abd14053:tests/mobile-playback-recovery.spec.js > tests/mobile-playback-recovery.spec.js
          rm -f tests/mobile-iframe-autoplay.spec.js

          python - <<'PY'
          from pathlib import Path

          player_path = Path('site/js/player-controller.js')
          text = player_path.read_text(encoding='utf-8')

          anchor = '''  setPlayerUiState("loading", playback.vodId, loadingStartSec, playback.statusLabel, loadingMode);

  if (isSeekReadySameVod) {'''
          replacement = '''  setPlayerUiState("loading", playback.vodId, loadingStartSec, playback.statusLabel, loadingMode);

  if (
    playback.triggeredByUser &&
    isInteractivePlayerReady() &&
    !isInteractiveSeekReadyForVod(playback.vodId) &&
    switchInteractiveVideo(playback)
  ) {
    return;
  }

  if (isSeekReadySameVod) {'''
          if text.count(anchor) != 1:
              raise SystemExit(f'request playback anchor count={text.count(anchor)}')
          text = text.replace(anchor, replacement, 1)

          old_seek = '''function seekDesiredPlayback(playback) {
  if (!isInteractiveSeekReadyForVod(playback.vodId)) {
    return;
  }

  ensureInteractiveEmbedLayout();
  const player = state.playerInstance;
  safeSetMuted(player, playback.muted);
  state.currentPlaybackSec = playback.startSec;
  seekInteractivePlayer(player, playback.startSec, { shouldPlay: playback.autoplay !== false });

  state.playerMode = "interactive";
  state.playerReady = true;
  state.playbackBlocked = false;
  startPlayerPolling();
  setInteractiveUiState(playback.autoplay !== false ? "playing" : "ready", playback.statusLabel);
}'''
          new_seek = '''function switchInteractiveVideo(playback) {
  const player = state.playerInstance;
  if (!isInteractivePlayerReady() || !player) {
    return false;
  }

  const shouldPlay = playback.autoplay !== false;
  ensureInteractiveEmbedLayout();
  safeSetMuted(player, playback.muted);
  state.currentPlaybackSec = playback.startSec;
  markInteractiveSeek(playback.startSec);
  setInteractiveUiState(shouldPlay ? "starting" : "ready", playback.statusLabel);

  if (!safeSetVideo(player, playback.vodId, playback.startSec)) {
    return false;
  }

  state.interactiveVodId = playback.vodId;
  state.playerMode = "interactive";
  state.playerReady = true;
  state.playbackBlocked = false;
  startPlayerPolling();
  if (shouldPlay) {
    safePlay(player);
  }
  scheduleInteractiveTimeSync();
  return true;
}


function seekDesiredPlayback(playback) {
  if (!isInteractiveSeekReadyForVod(playback.vodId)) {
    return;
  }

  ensureInteractiveEmbedLayout();
  const player = state.playerInstance;
  const shouldPlay = playback.autoplay !== false;
  safeSetMuted(player, playback.muted);
  state.currentPlaybackSec = playback.startSec;
  setInteractiveUiState(shouldPlay ? "starting" : "ready", playback.statusLabel);
  seekInteractivePlayer(player, playback.startSec, { shouldPlay });

  state.playerMode = "interactive";
  state.playerReady = true;
  state.playbackBlocked = false;
  startPlayerPolling();
}'''
          if text.count(old_seek) != 1:
              raise SystemExit(f'seek function count={text.count(old_seek)}')
          text = text.replace(old_seek, new_seek, 1)

          ready_old = '''    state.playerReady = true;
    clearInteractiveMountState(playback.token);
    state.playbackBlocked = false;
    setInteractiveUiState("ready", "Player ready");

    const targetPlayback = state.desiredPlayback || playback;'''
          ready_new = '''    state.playerReady = true;
    clearInteractiveMountState(playback.token);
    state.playbackBlocked = false;
    setInteractiveUiState("ready", "Player ready");
    window.dispatchEvent(
      new CustomEvent("twitch-player-ready", { detail: { vodId: String(playback.vodId || "") } })
    );

    const targetPlayback = state.desiredPlayback || playback;'''
          if text.count(ready_old) != 1:
              raise SystemExit(f'ready event anchor count={text.count(ready_old)}')
          text = text.replace(ready_old, ready_new, 1)

          ready_actions_old = '''    const shouldAutoplay = targetPlayback.autoplay !== false;
    if (Number(targetPlayback.startSec) !== mountStartSec) {
      seekInteractivePlayer(player, targetPlayback.startSec, { shouldPlay: shouldAutoplay });
    } else if (shouldAutoplay) {
      safePlay(player);
    }
    setInteractiveUiState(shouldAutoplay ? "playing" : "ready", targetPlayback.statusLabel);'''
          ready_actions_new = '''    const shouldAutoplay = targetPlayback.autoplay !== false;
    setInteractiveUiState(shouldAutoplay ? "starting" : "ready", targetPlayback.statusLabel);
    if (Number(targetPlayback.startSec) !== mountStartSec) {
      seekInteractivePlayer(player, targetPlayback.startSec, { shouldPlay: shouldAutoplay });
    } else if (shouldAutoplay) {
      safePlay(player);
    }'''
          if text.count(ready_actions_old) != 1:
              raise SystemExit(f'ready action anchor count={text.count(ready_actions_old)}')
          text = text.replace(ready_actions_old, ready_actions_new, 1)

          ready_helper_anchor = '''function isInteractiveSeekReadyForVod(vodId) {'''
          ready_helper = '''function isInteractivePlayerReady() {
  return (
    state.playerMode === "interactive" &&
    Boolean(state.playerInstance) &&
    state.playerReady === true
  );
}


function isInteractiveSeekReadyForVod(vodId) {'''
          if text.count(ready_helper_anchor) != 1:
              raise SystemExit(f'ready helper anchor count={text.count(ready_helper_anchor)}')
          text = text.replace(ready_helper_anchor, ready_helper, 1)

          set_video_anchor = '''function safeSeek(player, startSec) {'''
          set_video_helper = '''function safeSetVideo(player, vodId, startSec) {
  if (!player || typeof player.setVideo !== "function") {
    return false;
  }
  try {
    player.setVideo(String(vodId || "").replace(/^v/i, ""), Math.max(0, Number(startSec) || 0));
    return true;
  } catch (error) {
    return false;
  }
}


function safeSeek(player, startSec) {'''
          if text.count(set_video_anchor) != 1:
              raise SystemExit(f'setVideo helper anchor count={text.count(set_video_anchor)}')
          text = text.replace(set_video_anchor, set_video_helper, 1)
          player_path.write_text(text, encoding='utf-8')

          view_path = Path('site/js/vod-list-view.js')
          view = view_path.read_text(encoding='utf-8')
          state_anchor = '''  const vodTabState = {
    activeVodId: null,
  };

  bindPlayerFrameSummarySync();'''
          state_replacement = '''  const vodTabState = {
    activeVodId: null,
  };
  const gatePlaybackControls =
    typeof window.matchMedia === "function" && window.matchMedia("(max-width: 640px)").matches;
  let playbackControlsReady = !gatePlaybackControls;

  window.addEventListener("twitch-player-ready", () => {
    playbackControlsReady = true;
    syncPlaybackControlAvailability();
  });

  bindPlayerFrameSummarySync();'''
          if view.count(state_anchor) != 1:
              raise SystemExit(f'view state anchor count={view.count(state_anchor)}')
          view = view.replace(state_anchor, state_replacement, 1)

          button_anchor = '''        button.dataset.hasThumbnail = "false";
        button.querySelector(".segment-summary").textContent = segment.summary;'''
          button_replacement = '''        button.dataset.hasThumbnail = "false";
        setPlaybackControlReadyState(button);
        button.querySelector(".segment-summary").textContent = segment.summary;'''
          if view.count(button_anchor) != 1:
              raise SystemExit(f'button readiness anchor count={view.count(button_anchor)}')
          view = view.replace(button_anchor, button_replacement, 1)

          function_anchor = '''  function renderSegmentTags(container, tags) {'''
          function_block = '''  function setPlaybackControlReadyState(control) {
    if (!control) {
      return;
    }
    const disabled = !playbackControlsReady;
    control.disabled = disabled;
    control.setAttribute("aria-disabled", String(disabled));
    control.dataset.playerReady = String(playbackControlsReady);
    control.title = disabled ? "プレイヤー準備中" : "";
  }

  function syncPlaybackControlAvailability() {
    elements.vodList?.querySelectorAll(".segment-button").forEach(setPlaybackControlReadyState);
    setPlaybackControlReadyState(elements.activityMapButton);
    setPlaybackControlReadyState(elements.playerRewind10);
  }

  function renderSegmentTags(container, tags) {'''
          if view.count(function_anchor) != 1:
              raise SystemExit(f'view function anchor count={view.count(function_anchor)}')
          view = view.replace(function_anchor, function_block, 1)

          end_render_anchor = '''    updateActiveButtons();
    renderVodTabs();
    applyVodTabVisibility();
  }'''
          end_render_replacement = '''    updateActiveButtons();
    renderVodTabs();
    applyVodTabVisibility();
    syncPlaybackControlAvailability();
  }'''
          if view.count(end_render_anchor) != 1:
              raise SystemExit(f'end render anchor count={view.count(end_render_anchor)}')
          view = view.replace(end_render_anchor, end_render_replacement, 1)
          view_path.write_text(view, encoding='utf-8')

          config_path = Path('site/js/config.js')
          config = config_path.read_text(encoding='utf-8')
          config = config.replace('export const SITE_BUILD_LABEL = "build at 05.25";', 'export const SITE_BUILD_LABEL = "mobile playback verified 20260730";')
          config_path.write_text(config, encoding='utf-8')

          rewind_path = Path('tests/rewind.spec.js')
          rewind = rewind_path.read_text(encoding='utf-8')
          old_set_video = '''      setVideo(video, seconds) {
        this.setVideoCalls += 1;
        if (String(video) === String(this.video)) {
          return;
        }
        this.video = video;
        this.pendingTime = Number(seconds);
        this.emit("ready");
      }'''
          new_set_video = '''      setVideo(video, seconds) {
        this.setVideoCalls += 1;
        this.video = video;
        this.currentTime = Number(seconds);
        this.pendingTime = null;
        this.emit("playing");
      }'''
          if rewind.count(old_set_video) != 1:
              raise SystemExit(f'rewind setVideo anchor count={rewind.count(old_set_video)}')
          rewind_path.write_text(rewind.replace(old_set_video, new_set_video, 1), encoding='utf-8')
          PY

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/js/player-controller.js site/js/vod-list-view.js site/js/config.js tests/rewind.spec.js tests/mobile-playback-recovery.spec.js tests/mobile-iframe-autoplay.spec.js
          git commit -m "Restore verified mobile SDK playback"
          git push origin HEAD:fix/verify-real-mobile-playback-20260730
