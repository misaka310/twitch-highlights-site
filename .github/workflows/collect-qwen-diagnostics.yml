name: Collect Qwen headline diagnostics

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect-qwen-diagnostics.yml"

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TARGET_HEAD_SHA: 743e2d4f4d695472b8b83ef26539f85b3350a9a8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and sanitize final diagnostics
        shell: bash
        run: |
          python - <<'PY'
          import io
          import os
          import zipfile
          from pathlib import Path

          import requests

          repo = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["TARGET_HEAD_SHA"]
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          api = f"https://api.github.com/repos/{repo}"
          runs = requests.get(
              f"{api}/actions/runs",
              headers=headers,
              params={"event": "push", "branch": "main", "per_page": 50},
              timeout=30,
          )
          runs.raise_for_status()
          matches = [
              run
              for run in runs.json().get("workflow_runs", [])
              if run.get("name") == "Update VOD data"
              and run.get("head_sha") == target_sha
              and run.get("status") == "completed"
          ]
          if not matches:
              raise SystemExit(f"completed Update VOD data run not found for {target_sha}")
          run = matches[0]

          artifacts = requests.get(
              f"{api}/actions/runs/{run['id']}/artifacts",
              headers=headers,
              timeout=30,
          )
          artifacts.raise_for_status()
          artifact = next(
              (
                  item
                  for item in artifacts.json().get("artifacts", [])
                  if item.get("name") == f"headline-diagnostics-{run['id']}"
              ),
              None,
          )
          if artifact is None:
              raise SystemExit(f"headline diagnostics artifact not found for run {run['id']}")

          archive = requests.get(
              artifact["archive_download_url"],
              headers=headers,
              timeout=60,
          )
          archive.raise_for_status()
          with zipfile.ZipFile(io.BytesIO(archive.content)) as zf:
              text = zf.read("headline-diagnostics.txt").decode("utf-8", errors="replace")

          allowed = (
              "item_id:",
              "transcript_pass:",
              "source_candidate_count:",
              "source_validation:",
              "provider_candidates:",
              "final_headline:",
              "selection_reason:",
              "headline_status:",
              "headline_generation_mode:",
              "headline_confidence:",
              "headline_source:",
              "headline_model:",
              "fallback_reason:",
          )
          output = [
              f"run_id: {run['id']}",
              f"head_sha: {target_sha}",
              f"conclusion: {run.get('conclusion')}",
              "",
          ]
          for line in text.splitlines():
              if line.startswith("headline-result "):
                  output.append("headline-result ----------------------------------------")
              elif line.startswith(allowed):
                  output.append(line)
              elif line.startswith("--------------------------------------------------------"):
                  output.append(line)
                  output.append("")

          Path("headline-diagnostics-summary.txt").write_text(
              "\n".join(output).rstrip() + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit sanitized summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add headline-diagnostics-summary.txt
          git commit -m "Add final Qwen headline diagnostics summary"
          git pull --rebase origin main
          git push origin HEAD:main
